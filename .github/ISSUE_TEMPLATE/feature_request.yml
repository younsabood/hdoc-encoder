name: Feature request
description: Suggest an encoder feature or integration.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: What use case should this support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What behavior or API do you propose?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
